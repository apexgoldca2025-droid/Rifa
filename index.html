      let unsubTickets = null;

      // === UTILIDADES PURAS ===
      function esc(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function safeImageSrc(url) {
        const t = String(url || "").trim();
        if (
          t.startsWith("https://") ||
          t.startsWith("http://") ||
          t.startsWith("data:image/")
        ) {
          return t;
        }
        return "";
      }

      function toDate(val) {
        if (val instanceof Timestamp) return val.toDate();
        if (val instanceof Date) return val;
        if (val && typeof val.toDate === "function") return val.toDate();
        return null;
      }

      function getPadLength(totalTickets, startNumber) {
        const maxNum = Math.max(startNumber + totalTickets - 1, 0);
        return Math.max(2, String(maxNum).length);
      }

      function formatTicketNumber(num, totalTickets, startNumber = 0) {
        return String(num).padStart(getPadLength(totalTickets, startNumber), "0");
      }

      function formatMoney(amount, currency = "MXN") {
        const cur = String(currency || "MXN").toUpperCase();
        if (cur === "VES" || cur === "BS") return formatBolivares(amount);
        const symbol = cur === "EUR" ? "€" : cur === "PEN" ? "S/" : "$";
        const formatted = new Intl.NumberFormat("es-MX", {
          minimumFractionDigits: amount % 1 === 0 ? 0 : 2,
          maximumFractionDigits: 2,
        }).format(amount);
        return `${symbol}${formatted} ${currency}`;
      }

      function formatBolivares(amountBs) {
        const safe = Number.isFinite(amountBs) ? Math.max(0, amountBs) : 0;
        const [intPart, decPart] = safe.toFixed(2).split(".");
        const withThousands = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return `${withThousands},${decPart}Bs`;
      }

      function convertToBolivares(amount, currency, rateInfo) {
        if (!Number.isFinite(amount) || amount < 0) return null;
        const cur = String(currency || "USD").trim().toUpperCase();
        if (cur === "VES" || cur === "BS") return amount;
        if (!rateInfo || !Number.isFinite(rateInfo.usdToBs) || rateInfo.usdToBs <= 0) {
          return null;
        }
        if (cur === "USD") return amount * rateInfo.usdToBs;
        if (cur === "EUR") {
          if (rateInfo.eurToBs && rateInfo.eurToBs > 0) return amount * rateInfo.eurToBs;
          const perUsd = rateInfo.usdRates?.EUR;
          return perUsd > 0 ? (amount / perUsd) * rateInfo.usdToBs : null;
        }
        const perUsd = rateInfo.usdRates?.[cur];
        return perUsd > 0 ? (amount / perUsd) * rateInfo.usdToBs : null;
      }

      function formatReservationDateParts(date) {
        if (!(date instanceof Date) || Number.isNaN(date.getTime())) return null;
        return {
          date: new Intl.DateTimeFormat("es-VE", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
          }).format(date),
          time: new Intl.DateTimeFormat("es-VE", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: true,
          }).format(date),
        };
      }

      function formatReservationDateTime(date) {
        const p = formatReservationDateParts(date);
        return p ? `${p.date} · ${p.time}` : "—";
      }

      function sanitizePhoneDigits(phone) {
        return String(phone || "").replace(/\D/g, "");
      }

      function normalizeCedulaDigits(cedula) {
        return String(cedula || "").replace(/\D/g, "");
      }

      async function hashCedula(cedula) {
        const digits = normalizeCedulaDigits(cedula);
        const data = new TextEncoder().encode(`rifaclara-cedula:${digits}`);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(digest))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      function getActiveRaffle() {
        if (state.raffles.length === 0) return null;
        if (state.selectedRaffleId) {
          const found = state.raffles.find((r) => r.id === state.selectedRaffleId);
          if (found) return found;
        }
        return state.raffles.find((r) => r.isFeatured) || state.raffles[0];
      }

      function calculateStats(raffle, tickets) {
        if (!raffle) {
          return {
            total: 0,
            availableCount: 0,
            reservedCount: 0,
            paidCount: 0,
            occupiedCount: 0,
            soldPercentage: 0,
            collectedAmount: 0,
            pendingAmount: 0,
          };
        }
        const total = Math.max(0, raffle.totalTickets);
        const price = Math.max(0, raffle.ticketPrice);
        const reservedCount = tickets.filter((t) => t.status === "apartado").length;
        const paidCount = tickets.filter((t) => t.status === "pagado").length;
        const occupiedCount = Math.min(total, reservedCount + paidCount);
        const availableCount = Math.max(0, total - occupiedCount);
        const soldPercentage = total > 0 ? Math.round((occupiedCount / total) * 100) : 0;
        return {
          total,
          availableCount,
          reservedCount,
          paidCount,
          occupiedCount,
          soldPercentage,
          collectedAmount: paidCount * price,
          pendingAmount: reservedCount * price,
        };
      }

      function buildWhatsAppUrl({
        whatsappPhone,
        raffleTitle,
        ticketNumbers,
        totalTickets,
        startNumber,
        totalAmount,
        totalAmountBs,
        currency,
        holderName,
        holderCedula,
        holderCity,
      }) {
        const digits = sanitizePhoneDigits(whatsappPhone);
        const formattedTickets = ticketNumbers
          .slice()
          .sort((a, b) => a - b)
          .map((n) => formatTicketNumber(n, totalTickets, startNumber))
          .join(", ");
        const cityPart = holderCity?.trim() ? ` (${holderCity.trim()})` : "";
        const cur = String(currency || "").trim().toUpperCase();
        const bsSuffix =
          totalAmountBs != null &&
          Number.isFinite(totalAmountBs) &&
          cur !== "VES" &&
          cur !== "BS"
            ? ` (Ref. BCV: ${formatBolivares(totalAmountBs)})`
            : "";
        const lines = [
          `Hola, quiero concretar mi compra en *${raffleTitle.trim()}*.`,
          `• Participante: ${holderName.trim()}${cityPart}`,
        ];
        if (holderCedula?.trim()) lines.push(`• Cédula: ${holderCedula.trim()}`);
        lines.push(`• Boletos apartados: ${formattedTickets}`);
        lines.push(`• Total a pagar: ${formatMoney(totalAmount, currency)}${bsSuffix}`);
        return `https://wa.me/${digits}?text=${encodeURIComponent(lines.join("\n"))}`;
      }

      async function compressGalleryImage(file) {
        if (!file.type.startsWith("image/")) {
          throw new Error("El archivo seleccionado no es una imagen válida.");
        }
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("No se pudo leer la imagen."));
          reader.readAsDataURL(file);
        });
        const img = await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("No se pudo procesar la imagen."));
          image.src = dataUrl;
        });
        const targetLimit = 260000;
        const attempts = [
          { maxDim: 960, quality: 0.82 },
          { maxDim: 800, quality: 0.72 },
          { maxDim: 640, quality: 0.6 },
          { maxDim: 480, quality: 0.48 },
        ];
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        for (const attempt of attempts) {
          const w0 = img.naturalWidth || img.width;
          const h0 = img.naturalHeight || img.height;
          let w = w0;
          let h = h0;
          if (w0 > attempt.maxDim || h0 > attempt.maxDim) {
            const scale = attempt.maxDim / Math.max(w0, h0);
            w = Math.max(1, Math.round(w0 * scale));
            h = Math.max(1, Math.round(h0 * scale));
          }
          canvas.width = w;
          canvas.height = h;
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL("image/jpeg", attempt.quality);
          if (compressed.length <= targetLimit) return compressed;
        }
        throw new Error("La imagen es demasiado grande incluso comprimida.");
      }

      // === TASA BCV AUTOMÁTICA ===
      async function loadBcvRate() {
        const fetchJson = async (url) => {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 6000);
          try {
            const res = await fetch(url, { signal: ctrl.signal });
            return res.ok ? await res.json() : null;
          } catch {
            return null;
          } finally {
            clearTimeout(t);
          }
        };
        const [usdOficial, eurOficial, fxRes] = await Promise.all([
          fetchJson("https://ve.dolarapi.com/v1/dolares/oficial"),
          fetchJson("https://ve.dolarapi.com/v1/euros/oficial"),
          fetchJson("https://open.er-api.com/v6/latest/USD"),
        ]);
        const usdRates = fxRes?.result === "success" && fxRes.rates ? fxRes.rates : {};
        const bcvUsd =
          typeof usdOficial?.promedio === "number" && usdOficial.promedio > 0
            ? usdOficial.promedio
            : typeof usdRates.VES === "number" && usdRates.VES > 0
              ? usdRates.VES
              : 0;
        if (bcvUsd > 0) {
          state.bcvRate = {
            usdToBs: bcvUsd,
            eurToBs:
              typeof eurOficial?.promedio === "number" && eurOficial.promedio > 0
                ? eurOficial.promedio
                : null,
            usdRates,
          };
          render();
        }
      }

      // === SUSCRIPCIONES FIRESTORE ===
      onSnapshot(doc(db, "settings", "branding"), (snap) => {
        if (snap.exists()) {
          const raw = String(snap.data().brandName || "").trim();
          state.brandName = raw.length >= 2 ? raw : DEFAULT_BRAND_NAME;
        } else {
          state.brandName = DEFAULT_BRAND_NAME;
        }
        state.brandDraft = state.brandName;
        document.title = `${state.brandName} — Sistema de Rifas`;
        render();
      });

      onAuthStateChanged(auth, async (nextUser) => {
        state.user = nextUser;
        if (nextUser && nextUser.emailVerified) {
          if (nextUser.email === PRIMARY_ADMIN_EMAIL) {
            state.isAdmin = true;
          } else {
            try {
              const snap = await getDoc(doc(db, "admins", nextUser.uid));
              state.isAdmin = snap.exists();
            } catch {
              state.isAdmin = false;
            }
          }
        } else {
          state.isAdmin = false;
        }
        state.authReady = true;
        attachContactsSubscription();
        render();
      });

      let seededOnce = false;
      onSnapshot(
        query(collection(db, "raffles"), where("status", "in", ["active", "paused", "finished"])),
        async (snapshot) => {
          if (snapshot.empty && !seededOnce) {
            seededOnce = true;
            try {
              await runTransaction(db, async (tx) => {
                const ref = doc(db, "raffles", "rifa-principal");
                const cur = await tx.get(ref);
                if (!cur.exists()) {
                  tx.set(ref, {
                    ...DEFAULT_STARTER_RAFFLE,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                  });
                }
              });
            } catch (err) {
              state.loadError = err.message;
              state.loadingRaffles = false;
              render();
            }
            return;
          }
          state.raffles = snapshot.docs
            .map((d) => {
              const data = d.data();
              return {
                id: d.id,
                title: String(data.title || ""),
                description: String(data.description || ""),
                prizeName: String(data.prizeName || ""),
                prizeImage: String(data.prizeImage || ""),
                ticketPrice: Number(data.ticketPrice || 0),
                currency: String(data.currency || "MXN"),
                totalTickets: Number(data.totalTickets || 100),
                startNumber: Number(data.startNumber) === 1 ? 1 : 0,
                drawDate: String(data.drawDate || ""),
                drawMethod: String(data.drawMethod || ""),
                whatsappNumber: String(data.whatsappNumber || ""),
                paymentInstructions: String(data.paymentInstructions || ""),
                status: ["paused", "finished"].includes(data.status) ? data.status : "active",
                isFeatured: Boolean(data.isFeatured),
                winnerNumber: String(data.winnerNumber || ""),
                winnerName: String(data.winnerName || ""),
                createdAt: toDate(data.createdAt),
                updatedAt: toDate(data.updatedAt),
              };
            })
            .sort(
              (a, b) =>
                (b.createdAt ? b.createdAt.getTime() : 0) -
                (a.createdAt ? a.createdAt.getTime() : 0)
            );
          state.loadingRaffles = false;
          state.loadError = null;
          if (!state.isCreatingNew) {
            const active = getActiveRaffle();
            if (active) state.adminForm = { ...active };
          }
          attachRaffleSubcollections();
          render();
        },
        (err) => {
          state.loadError = err.message;
          state.loadingRaffles = false;
          render();
        }
      );

      let subscribedRaffleId = "";
      function attachRaffleSubcollections() {
        const active = getActiveRaffle();
        const nextId = active ? active.id : "";
        if (nextId === subscribedRaffleId) return;
        subscribedRaffleId = nextId;
        if (unsubTickets) {
          unsubTickets();
          unsubTickets = null;
        }
        state.tickets = [];
        if (nextId) {
          unsubTickets = onSnapshot(
            query(
              collection(db, `raffles/${nextId}/tickets`),
              where("status", "in", ["apartado", "pagado"])
            ),
            (snap) => {
              state.tickets = snap.docs
                .map((d) => {
                  const data = d.data({ serverTimestamps: "estimate" });
                  return {
                    raffleId: nextId,
                    ticketKey: d.id,
                    ticketNumber: Number(data.ticketNumber ?? Number(d.id)),
                    holderName: String(data.holderName || ""),
                    holderCity: String(data.holderCity || ""),
                    holderCedulaHash: data.holderCedulaHash
                      ? String(data.holderCedulaHash)
                      : undefined,
                    status: data.status === "pagado" ? "pagado" : "apartado",
                    createdAt: toDate(data.createdAt),
                    updatedAt: toDate(data.updatedAt),
                  };
                })
                .sort((a, b) => a.ticketNumber - b.ticketNumber);
              const taken = new Set(state.tickets.map((t) => t.ticketNumber));
              state.selectedNumbers = state.selectedNumbers.filter((n) => !taken.has(n));
              render();
            }
          );
        }
        attachContactsSubscription();
      }

      function attachContactsSubscription() {
        if (unsubContacts) {
          unsubContacts();
          unsubContacts = null;
        }
        const active = getActiveRaffle();
        if (!state.isAdmin || !active) {
          state.contacts = [];
          return;
        }
        unsubContacts = onSnapshot(
          collection(db, `raffles/${active.id}/contacts`),
          (snap) => {
            state.contacts = snap.docs.map((d) => {
              const data = d.data({ serverTimestamps: "estimate" });
              return {
                raffleId: active.id,
                ticketKey: d.id,
                holderName: String(data.holderName || ""),
                holderCedula: data.holderCedula ? String(data.holderCedula) : undefined,
                phone: String(data.phone || ""),
                createdAt: toDate(data.createdAt),
              };
            });
            render();
          },
          () => {
            state.contacts = [];
          }
        );
      }

      // === RENDERIZADO PRINCIPAL ===
      function render() {
        const activeRaffle = getActiveRaffle();
        const stats = calculateStats(activeRaffle, state.tickets);
        const root = document.getElementById("app");

        root.innerHTML = `
          ${renderNavbar()}
          ${
            state.activeView === "admin"
              ? renderAdminPanel(activeRaffle, stats)
              : renderPublicView(activeRaffle, stats)
          }
          ${renderMobileStickyBar(activeRaffle)}
          <footer class="border-t border-sky-200/80 bg-white py-6">
            <div class="mx-auto max-w-6xl px-4 text-center text-xs leading-relaxed text-stone-500 sm:px-6">
              <p>Sistema de Rifas</p>
              <p>Desarrollado por Alfredo Belandria</p>
            </div>
          </footer>
        `;

        bindEvents(activeRaffle);
      }

      function renderNavbar() {
        return `
          <header class="sticky top-0 z-30 border-b border-sky-200/90 bg-[#E1F0FC]/90 backdrop-blur-sm">
            <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3.5 sm:gap-8 sm:px-6">
              <button type="button" data-action="go-public" class="flex items-center gap-2 text-lg font-bold tracking-tight text-[#141413] whitespace-nowrap shrink-0 cursor-pointer">
                <span class="text-teal-700">🎟️</span>
                <span class="truncate max-w-[180px] sm:max-w-[260px]">${esc(state.brandName)}</span>
              </button>
              <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-stone-600">
                <button type="button" data-scroll="boletos" class="hover:text-[#141413] hover:underline underline-offset-4 cursor-pointer">Boletos</button>
                <button type="button" data-scroll="verificar" class="hover:text-[#141413] hover:underline underline-offset-4 cursor-pointer">Verificar</button>
                <button type="button" data-scroll="participantes" class="hover:text-[#141413] hover:underline underline-offset-4 cursor-pointer">Participantes</button>
                <button type="button" data-scroll="como-funciona" class="hover:text-[#141413] hover:underline underline-offset-4 cursor-pointer">Cómo funciona</button>
              </nav>
              <div class="flex items-center shrink-0">
                ${
                  state.activeView === "public"
                    ? `<button type="button" data-action="go-admin" class="inline-flex items-center gap-2 rounded-lg border border-stone-300 bg-white px-4 py-2 text-sm font-medium text-[#141413] hover:bg-stone-100 cursor-pointer">${state.isAdmin ? "Panel Admin" : "Admin"}</button>`
                    : `<button type="button" data-action="go-public" class="inline-flex items-center gap-2 rounded-lg bg-[#141413] px-4 py-2 text-sm font-medium text-white hover:bg-stone-800 cursor-pointer">Ver Rifa</button>`
                }
              </div>
            </div>
          </header>
        `;
      }

      function renderPublicView(raffle, stats) {
        if (state.loadingRaffles) {
          return `<main class="flex-1 mx-auto max-w-6xl w-full px-4 py-12 sm:px-6"><div class="h-80 rounded-2xl bg-white/70 animate-pulse"></div></main>`;
        }
        if (!raffle) {
          return `
            <main class="flex-1 mx-auto max-w-2xl px-4 py-20 text-center sm:px-6">
              <h1 class="text-2xl font-bold">No hay rifas publicadas en este momento</h1>
              <p class="mt-2 text-sm text-stone-600">El administrador puede crear una nueva rifa desde el Panel Admin.</p>
              <button type="button" data-action="go-admin" class="mt-6 rounded-xl bg-[#141413] px-5 py-3 text-sm font-semibold text-white cursor-pointer">Ir al Panel Admin</button>
            </main>
          `;
        }

        const curUpper = raffle.currency.trim().toUpperCase();
        const showBs = curUpper !== "VES" && curUpper !== "BS";
        const ticketBs = showBs ? convertToBolivares(raffle.ticketPrice, raffle.currency, state.bcvRate) : null;
        const imgSrc = safeImageSrc(raffle.prizeImage);

        return `
          <main class="flex-1 pb-20 lg:pb-12">
            ${
              state.raffles.length > 1
                ? `<div class="mx-auto max-w-6xl px-4 pt-5 sm:px-6">
                    <div class="flex flex-wrap items-center gap-2 text-xs text-stone-600">
                      <span class="font-medium">Rifas disponibles:</span>
                      ${state.raffles
                        .map(
                          (r) => `<button type="button" data-select-raffle="${esc(r.id)}" class="rounded-lg px-3 py-1.5 font-semibold cursor-pointer ${r.id === raffle.id ? "bg-[#141413] text-white" : "bg-white border border-stone-200 text-[#141413] hover:bg-stone-100"}">${esc(r.title)}</button>`
                        )
                        .join("")}
                    </div>
                  </div>`
                : ""
            }

            <!-- HERO -->
            <section class="mx-auto max-w-6xl px-4 pt-6 pb-8 sm:px-6 sm:pt-10 sm:pb-10">
              <div class="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:items-stretch">
                <div class="lg:col-span-6">
                  <div class="relative h-64 sm:h-80 lg:h-full lg:min-h-[340px] lg:max-h-[430px] w-full overflow-hidden rounded-2xl border border-stone-200 bg-stone-100">
                    ${
                      imgSrc
                        ? `<img src="${esc(imgSrc)}" alt="${esc(raffle.prizeName)}" referrerpolicy="no-referrer" class="h-full w-full object-cover" />`
                        : `<div class="flex h-full w-full flex-col items-center justify-center bg-gradient-to-br from-stone-100 to-stone-200 p-6 text-center">
                            <span class="text-4xl mb-2">🎁</span>
                            <p class="text-base font-semibold">${esc(raffle.prizeName)}</p>
                          </div>`
                    }
                  </div>
                </div>
                <div class="flex flex-col justify-between rounded-2xl border border-stone-200 bg-white p-6 sm:p-8 lg:col-span-6">
                  <div>
                    <div class="flex flex-wrap items-center gap-2 text-xs font-medium text-stone-500">
                      <span class="text-teal-800 font-semibold">${raffle.status === "active" ? "Rifa activa" : raffle.status === "paused" ? "Apartados pausados" : "Sorteo finalizado"}</span>
                      <span>·</span>
                      <span class="tabular-nums">${stats.total} boletos</span>
                      ${raffle.drawMethod ? `<span>·</span><span>${esc(raffle.drawMethod)}</span>` : ""}
                    </div>
                    <h1 class="mt-3 text-2xl font-bold tracking-tight sm:text-4xl">${esc(raffle.title)}</h1>
                    <p class="mt-2 text-base font-medium text-teal-800">Premio: ${esc(raffle.prizeName)}</p>
                    ${raffle.description ? `<p class="mt-3 text-sm leading-relaxed text-stone-600">${esc(raffle.description)}</p>` : ""}
                    ${
                      raffle.status === "finished" && raffle.winnerNumber
                        ? `<div class="mt-5 rounded-xl border border-amber-300 bg-amber-50 p-4">
                            <p class="text-xs font-semibold text-amber-900">Boleto ganador #${esc(raffle.winnerNumber)}</p>
                            <p class="text-sm font-bold">${esc(raffle.winnerName || "Ganador confirmado")}</p>
                          </div>`
                        : ""
                    }
                  </div>
                  <div class="mt-6 space-y-5 border-t border-stone-100 pt-5">
                    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
                      <div>
                        <p class="text-xs text-stone-500">Boleto</p>
                        <p class="mt-0.5 font-arial text-xl font-bold tracking-tight tabular-nums sm:text-2xl">${esc(formatMoney(raffle.ticketPrice, raffle.currency))}</p>
                        ${
                          ticketBs !== null
                            ? `<p class="mt-0.5 font-mono-custom text-xs font-semibold text-[#489B22] tabular-nums">${esc(formatBolivares(ticketBs))} <span class="font-sans text-[11px] font-normal text-stone-400">· Ref. BCV</span></p>`
                            : ""
                        }
                      </div>
                      <div>
                        <p class="text-xs text-stone-500">Disponibles</p>
                        <p class="mt-0.5 font-mono-custom text-base font-semibold text-teal-800 tabular-nums sm:text-lg">${stats.availableCount} / ${stats.total}</p>
                      </div>
                      <div class="col-span-2 sm:col-span-1">
                        <p class="text-xs text-stone-500">Sorteo</p>
                        <p class="mt-0.5 text-sm font-semibold leading-snug">${esc(raffle.drawDate || "Por definir")}</p>
                      </div>
                    </div>
                    <div>
                      <div class="mb-1.5 flex items-center justify-between text-xs text-stone-500">
                        <span>Avance de boletos apartados y pagados</span>
                        <span class="font-mono-custom font-medium text-[#141413] tabular-nums">${stats.soldPercentage}%</span>
                      </div>
                      <div class="h-2 w-full overflow-hidden rounded-full bg-stone-100">
                        <div class="h-full rounded-full bg-teal-700" style="width:${Math.min(100, stats.soldPercentage)}%"></div>
                      </div>
                    </div>
                    <button type="button" data-scroll="boletos" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[#141413] px-5 py-3 text-sm font-semibold text-white hover:bg-stone-800 cursor-pointer">
                      <span>${raffle.status === "active" ? "Elegir mis números ↓" : "Ver tablero de boletos ↓"}</span>
                    </button>
                  </div>
                </div>
              </div>
            </section>

            <!-- TABLERO + REGISTRO -->
            <section class="mx-auto max-w-6xl px-4 py-6 sm:px-6">
              <div class="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:items-start">
                <div class="lg:col-span-8">${renderTicketBoard(raffle)}</div>
                <div class="lg:col-span-4">${renderReservationPanel(raffle)}</div>
              </div>
            </section>

            ${renderVerifierSection()}
            ${renderParticipantsSection(raffle)}
            ${renderHowItWorks()}
          </main>
        `;
      }

      function renderTicketBoard(raffle) {
        const ticketMap = new Map(state.tickets.map((t) => [t.ticketNumber, t]));
        const selectedSet = new Set(state.selectedNumbers);
        const q = state.boardSearch.trim().toLowerCase();
        const allNumbers = Array.from(
          { length: Math.max(0, Math.min(1000, raffle.totalTickets)) },
          (_, i) => raffle.startNumber + i
        );
        const filtered = allNumbers.filter((num) => {
          const res = ticketMap.get(num);
          if (state.boardFilter === "available" && res) return false;
          if (state.boardFilter === "apartado" && res?.status !== "apartado") return false;
          if (state.boardFilter === "pagado" && res?.status !== "pagado") return false;
          if (!q) return true;
          const formatted = formatTicketNumber(num, raffle.totalTickets, raffle.startNumber);
          return (
            formatted.includes(q) ||
            String(num).includes(q) ||
            (res?.holderName || "").toLowerCase().includes(q) ||
            (res?.holderCity || "").toLowerCase().includes(q)
          );
        });

        return `
          <div id="boletos" class="scroll-mt-20 space-y-5">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <h2 class="text-xl font-bold tracking-tight">Tablero de boletos</h2>
                <p class="mt-1 text-sm text-stone-600">Toca un boleto disponible para apartarlo o toca uno ocupado para ver quién lo registró.</p>
              </div>
              ${
                raffle.status === "active"
                  ? `<div class="flex items-center gap-2 shrink-0">
                      <button type="button" data-random="1" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-xs font-semibold hover:bg-stone-100 cursor-pointer">1 al azar</button>
                      <button type="button" data-random="3" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-xs font-semibold hover:bg-stone-100 cursor-pointer">3 al azar</button>
                    </div>`
                  : ""
              }
            </div>
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div class="inline-flex flex-wrap items-center gap-1 rounded-xl bg-stone-200/70 p-1">
                ${[
                  ["all", "Todos"],
                  ["available", "Disponibles"],
                  ["apartado", "Apartados"],
                  ["pagado", "Pagados"],
                ]
                  .map(
                    ([id, label]) =>
                      `<button type="button" data-board-filter="${id}" class="rounded-lg px-3 py-1.5 text-xs font-semibold cursor-pointer ${state.boardFilter === id ? "bg-white text-[#141413] shadow-xs" : "text-stone-600"}">${label}</button>`
                  )
                  .join("")}
              </div>
              <input id="board-search" type="search" value="${esc(state.boardSearch)}" placeholder="Buscar # o participante..." class="w-full sm:w-64 rounded-xl border border-stone-200 bg-white py-2 px-3 text-sm focus:border-teal-700 focus:outline-none" />
            </div>
            ${
              state.inspectedTicket
                ? `<div class="flex items-center justify-between gap-4 rounded-xl border border-stone-200 bg-white p-4">
                    <div>
                      <p class="text-xs font-medium text-stone-500">Boleto #${esc(formatTicketNumber(state.inspectedTicket.ticketNumber, raffle.totalTickets, raffle.startNumber))} · <span class="font-semibold ${state.inspectedTicket.status === "pagado" ? "text-teal-800" : "text-amber-800"}">${state.inspectedTicket.status === "pagado" ? "Pagado" : "Apartado"}</span></p>
                      <p class="text-sm font-semibold">Registrado por ${esc(state.inspectedTicket.holderName)}${state.inspectedTicket.holderCity ? ` · ${esc(state.inspectedTicket.holderCity)}` : ""}</p>
                    </div>
                    <button type="button" data-action="close-inspect" class="rounded-lg px-2 py-1 text-xs font-semibold text-stone-500 hover:bg-stone-100 cursor-pointer">✕</button>
                  </div>`
                : ""
            }
            <div class="grid grid-cols-5 gap-2 sm:grid-cols-8 md:grid-cols-10">
              ${filtered
                .map((num) => {
                  const formatted = formatTicketNumber(num, raffle.totalTickets, raffle.startNumber);
                  const res = ticketMap.get(num);
                  const isSel = selectedSet.has(num);
                  let cls = "border-stone-200 bg-white text-[#141413] hover:border-teal-700";
                  if (res) {
                    cls =
                      res.status === "pagado"
                        ? "border-stone-200 bg-stone-200/80 text-stone-600"
                        : "border-amber-300 bg-amber-50 text-amber-900";
                  } else if (isSel) {
                    cls = "border-teal-800 bg-teal-700 text-white";
                  }
                  return `<button type="button" data-ticket="${num}" class="flex min-h-[44px] flex-col items-center justify-center rounded-xl border px-1 py-2 font-mono-custom text-sm font-semibold tabular-nums cursor-pointer ${cls}">
                    <span>${formatted}</span>
                    ${res ? `<span class="mt-0.5 text-[10px] font-sans font-medium leading-none opacity-80">${res.status === "pagado" ? "Pag." : "Apart."}</span>` : ""}
                  </button>`;
                })
                .join("")}
            </div>
          </div>
        `;
      }

      function renderReservationPanel(raffle) {
        if (state.receipt) {
          const r = state.receipt;
          const rCur = r.currency.trim().toUpperCase();
          const showRBs = rCur !== "VES" && rCur !== "BS";
          const rBs = showRBs
            ? r.totalAmountBs ?? convertToBolivares(r.totalAmount, r.currency, state.bcvRate)
            : null;
          return `
            <aside id="registro-panel" class="rounded-2xl border border-teal-200 bg-white p-6 lg:sticky lg:top-20">
              <h3 class="text-lg font-bold">Boletos apartados en la nube</h3>
              <p class="mt-1 text-sm text-stone-600">Tu registro ya es visible en el tablero para todos.</p>
              <div class="mt-4 space-y-2.5 rounded-xl border border-stone-200 bg-[#F8F8F6] p-4 text-sm">
                <div class="flex justify-between gap-2"><span class="text-stone-500">Participante</span><span class="font-semibold">${esc(r.holderName)}</span></div>
                <div class="flex justify-between gap-2"><span class="text-stone-500">Cédula</span><span class="font-mono-custom font-semibold">${esc(r.holderCedula)}</span></div>
                <div class="flex justify-between gap-2"><span class="text-stone-500">Boletos</span><span class="font-mono-custom font-semibold text-teal-800 text-right">${esc(r.formattedNumbers.join(", "))}</span></div>
                <div class="flex justify-between gap-2 border-t border-stone-200 pt-2">
                  <span class="text-stone-500">Total</span>
                  <div class="text-right">
                    <span class="block font-arial text-lg font-bold">${esc(formatMoney(r.totalAmount, r.currency))}</span>
                    ${rBs !== null ? `<span class="block font-mono-custom text-xs font-semibold text-[#489B22]">${esc(formatBolivares(rBs))} · Ref. BCV</span>` : ""}
                  </div>
                </div>
              </div>
              ${
                r.paymentInstructions
                  ? `<div class="mt-4 rounded-xl border border-stone-200 bg-stone-50 p-3.5 text-xs text-stone-700"><p class="font-semibold mb-1">Datos para pago</p><p>${esc(r.paymentInstructions)}</p></div>`
                  : ""
              }
              <div class="mt-5 space-y-2.5">
                <a href="${esc(r.whatsappUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-[44px] w-full items-center justify-center rounded-xl bg-[#16A34A] px-4 py-3 text-sm font-semibold text-white hover:bg-[#15803D]">Concretar compra por WhatsApp</a>
                <button type="button" data-action="reset-receipt" class="inline-flex min-h-[40px] w-full items-center justify-center rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-semibold cursor-pointer">Apartar otros</button>
              </div>
            </aside>
          `;
        }

        const total = state.selectedNumbers.length * raffle.ticketPrice;
        const curUpper = raffle.currency.trim().toUpperCase();
        const showBs = curUpper !== "VES" && curUpper !== "BS";
        const totalBs = showBs ? convertToBolivares(total, raffle.currency, state.bcvRate) : null;
        const waDigits = sanitizePhoneDigits(raffle.whatsappNumber);
        const quickWaUrl =
          state.selectedNumbers.length > 0
            ? buildWhatsAppUrl({
                whatsappPhone: raffle.whatsappNumber,
                raffleTitle: raffle.title,
                ticketNumbers: state.selectedNumbers,
                totalTickets: raffle.totalTickets,
                startNumber: raffle.startNumber,
                totalAmount: total,
                totalAmountBs: totalBs,
                currency: raffle.currency,
                holderName: state.buyerName.trim() || "Participante",
                holderCedula: state.buyerCedula.trim(),
                holderCity: state.buyerCity.trim(),
              })
            : `https://wa.me/${waDigits}?text=${encodeURIComponent(`Hola, quiero más información sobre *${raffle.title}*.`)}`;

        return `
          <aside id="registro-panel" class="rounded-2xl border border-stone-200 bg-white p-6 lg:sticky lg:top-20">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold">Tu selección</h3>
              ${state.selectedNumbers.length > 0 ? `<button type="button" data-action="clear-selection" class="text-xs font-medium text-stone-500 hover:text-red-700 cursor-pointer">Limpiar</button>` : ""}
            </div>
            ${
              state.selectedNumbers.length === 0
                ? `<div class="mt-3 rounded-xl border border-dashed border-stone-300 bg-[#F8F8F6] p-4 text-center text-sm text-stone-600">${raffle.status === "active" ? "Selecciona uno o más boletos disponibles en el tablero." : "Esta rifa no acepta nuevos apartados."}</div>`
                : `<div class="mt-3 space-y-3">
                    <div class="flex flex-wrap gap-1.5">
                      ${state.selectedNumbers
                        .map(
                          (n) => `<button type="button" data-remove-num="${n}" class="rounded-lg bg-teal-50 border border-teal-200 px-2.5 py-1 font-mono-custom text-xs font-semibold text-teal-900 cursor-pointer">#${formatTicketNumber(n, raffle.totalTickets, raffle.startNumber)} ✕</button>`
                        )
                        .join("")}
                    </div>
                    <div class="flex items-start justify-between border-t border-stone-100 pt-3">
                      <span class="text-sm text-stone-600">${state.selectedNumbers.length} ${state.selectedNumbers.length === 1 ? "boleto" : "boletos"}</span>
                      <div class="text-right">
                        <span class="block font-arial text-xl font-bold tabular-nums">${esc(formatMoney(total, raffle.currency))}</span>
                        ${totalBs !== null ? `<span class="block font-mono-custom text-xs font-semibold text-[#489B22] tabular-nums">${esc(formatBolivares(totalBs))} <span class="font-sans text-[11px] font-normal text-stone-400">· Ref. BCV</span></span>` : ""}
                      </div>
                    </div>
                  </div>`
            }
            ${
              raffle.status === "active"
                ? `<form id="buyer-form" class="mt-5 space-y-3.5 border-t border-stone-100 pt-5" novalidate>
                    <div>
                      <label class="block text-xs font-semibold">Nombre completo</label>
                      <input id="buyer-name" type="text" maxlength="80" value="${esc(state.buyerName)}" placeholder="Ej. María López" class="mt-1 w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm" />
                      ${state.buyerErrors.holderName ? `<p class="mt-1 text-xs text-red-700">${esc(state.buyerErrors.holderName)}</p>` : ""}
                    </div>
                    <div>
                      <label class="block text-xs font-semibold">Cédula de identidad</label>
                      <input id="buyer-cedula" type="text" maxlength="20" value="${esc(state.buyerCedula)}" placeholder="Ej. V-12345678 o 12345678" class="mt-1 w-full rounded-xl border border-stone-200 px-3.5 py-2.5 font-mono-custom text-sm" />
                      ${state.buyerErrors.holderCedula ? `<p class="mt-1 text-xs text-red-700">${esc(state.buyerErrors.holderCedula)}</p>` : ""}
                    </div>
                    <div>
                      <label class="block text-xs font-semibold">Ciudad o estado (opcional)</label>
                      <input id="buyer-city" type="text" maxlength="60" value="${esc(state.buyerCity)}" placeholder="Ej. Caracas" class="mt-1 w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold">Teléfono WhatsApp</label>
                      <input id="buyer-phone" type="tel" maxlength="25" value="${esc(state.buyerPhone)}" placeholder="Ej. 0412 1234567" class="mt-1 w-full rounded-xl border border-stone-200 px-3.5 py-2.5 font-mono-custom text-sm" />
                      <p class="mt-1 text-[11px] text-stone-500">Privado: solo visible para el organizador.</p>
                      ${state.buyerErrors.phone ? `<p class="mt-1 text-xs text-red-700">${esc(state.buyerErrors.phone)}</p>` : ""}
                    </div>
                    ${state.buyerSubmitError ? `<div class="rounded-xl border border-red-200 bg-red-50 p-3 text-xs text-red-800">${esc(state.buyerSubmitError)}</div>` : ""}
                    <button type="submit" ${state.buyerSubmitting || state.selectedNumbers.length === 0 ? "disabled" : ""} class="min-h-[44px] w-full rounded-xl bg-[#141413] px-4 py-3 text-sm font-semibold text-white disabled:opacity-50 cursor-pointer">${state.buyerSubmitting ? "Guardando registro..." : "Apartar boletos"}</button>
                    <a href="${esc(quickWaUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-[44px] w-full items-center justify-center rounded-xl border border-[#16A34A]/30 bg-[#16A34A]/10 px-4 py-2.5 text-sm font-semibold text-[#15803D]">Concretar compra por WhatsApp</a>
                  </form>`
                : ""
            }
          </aside>
        `;
      }

      function renderVerifierSection() {
        const res = state.verifyResult;
        let resultHtml = "";
        if (res.kind === "invalid") {
          resultHtml = `<div class="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">${esc(res.message)}</div>`;
        } else if (res.kind === "out_of_range") {
          resultHtml = `<div class="mt-4 rounded-xl border border-stone-200 bg-[#F8F8F6] p-4 text-sm">El boleto #${esc(res.rawNumber)} no pertenece a esta rifa.</div>`;
        } else if (res.kind === "ticket_available") {
          resultHtml = `<div class="mt-4 rounded-xl border border-stone-200 bg-[#F8F8F6] p-4"><p class="text-sm font-bold">Boleto #${esc(res.formattedNumber)} · Disponible</p><p class="text-xs text-stone-600">Aún está libre para apartar en el tablero.</p></div>`;
        } else if (res.kind === "ticket_found") {
          const paid = res.ticket.status === "pagado";
          resultHtml = `<div class="mt-4 rounded-xl border p-4 ${paid ? "border-teal-200 bg-teal-50/60" : "border-amber-200 bg-amber-50/70"}"><p class="text-sm font-bold">Boleto #${esc(res.formattedNumber)} · ${paid ? "Pagado y confirmado" : "Apartado (pendiente por pagar)"}</p><p class="text-xs text-stone-700">Titular: <strong>${esc(res.ticket.holderName)}</strong>${res.ticket.holderCity ? ` · ${esc(res.ticket.holderCity)}` : ""}</p></div>`;
        } else if (res.kind === "cedula_results") {
          resultHtml = `<div class="mt-4 rounded-xl border border-stone-200 bg-[#F8F8F6] p-4">${
            res.matches.length === 0
              ? `<p class="text-sm">No encontramos boletos registrados con la cédula <strong>${esc(res.cedulaDigits)}</strong>.</p>`
              : `<p class="text-sm font-bold mb-2">${esc(res.matches[0].holderName)} · ${res.matches.length} ${res.matches.length === 1 ? "boleto" : "boletos"}</p>
                 <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">
                   ${res.matches
                     .map((m) => {
                       const r = getActiveRaffle();
                       const fmt = formatTicketNumber(m.ticketNumber, r.totalTickets, r.startNumber);
                       const paid = m.status === "pagado";

      function renderParticipantsSection(raffle) {
        const map = new Map();
        for (const t of state.tickets) {
          const key = `${t.holderName.trim().toLowerCase()}__${t.holderCity.trim().toLowerCase()}`;
          const ts = t.createdAt ? t.createdAt.getTime() : 0;
          const prev = map.get(key);
          if (prev) {
            prev.tickets.push(t);
            if (t.status === "pagado") prev.paidCount += 1;
            else prev.reservedCount += 1;
            if (ts > prev.latestDate) prev.latestDate = ts;
          } else {
            map.set(key, {
              holderName: t.holderName,
              holderCity: t.holderCity,
              tickets: [t],
              paidCount: t.status === "pagado" ? 1 : 0,
              reservedCount: t.status === "apartado" ? 1 : 0,
              latestDate: ts,
            });
          }
        }
        const q = state.participantsSearch.trim().toLowerCase();
        const groups = Array.from(map.values())
          .sort((a, b) => b.latestDate - a.latestDate)
          .filter(
            (g) =>
              !q ||
              g.holderName.toLowerCase().includes(q) ||
              g.holderCity.toLowerCase().includes(q) ||
              g.tickets.some((t) =>
                formatTicketNumber(t.ticketNumber, raffle.totalTickets, raffle.startNumber).includes(q)
              )
          );

        return `
          <section id="participantes" class="scroll-mt-20 mx-auto max-w-6xl px-4 py-10 sm:px-6 border-t border-sky-200/75">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <h2 class="text-xl font-bold tracking-tight">Participantes registrados</h2>
                <p class="mt-1 text-sm text-stone-600">Lista actualizada en tiempo real de personas que ya apartaron o pagaron boletos.</p>
              </div>
              <input id="participants-search" type="search" value="${esc(state.participantsSearch)}" placeholder="Buscar participante o número..." class="w-full sm:w-72 rounded-xl border border-stone-200 bg-white py-2 px-3 text-sm" />
            </div>
            ${
              groups.length === 0
                ? `<div class="mt-6 rounded-2xl border border-stone-200 bg-white p-10 text-center text-sm text-stone-600">Aún no hay participantes registrados en esta rifa.</div>`
                : `<div class="mt-6 overflow-hidden rounded-2xl border border-stone-200 bg-white"><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="border-b border-stone-200 bg-stone-50 text-xs font-semibold text-stone-600"><th class="px-4 py-3">Participante</th><th class="px-4 py-3">Ciudad</th><th class="px-4 py-3">Números apartados</th><th class="px-4 py-3 text-right">Estado</th></tr></thead><tbody class="divide-y divide-stone-100">${groups
                    .map((g) => {
                      const nums = g.tickets
                        .slice()
                        .sort((a, b) => a.ticketNumber - b.ticketNumber)
                        .map((t) => formatTicketNumber(t.ticketNumber, raffle.totalTickets, raffle.startNumber))
                        .join(", ");
                      const lbl =
                        g.paidCount > 0 && g.reservedCount === 0
                          ? "Pagado"
                          : g.paidCount > 0
                            ? `${g.paidCount} pag. / ${g.reservedCount} apart.`
                            : "Apartado";
                      return `<tr><td class="px-4 py-3 font-semibold">${esc(g.holderName)}</td><td class="px-4 py-3 text-stone-600">${esc(g.holderCity || "—")}</td><td class="px-4 py-3 font-mono-custom text-xs">${esc(nums)}</td><td class="px-4 py-3 text-right text-xs font-semibold ${g.paidCount > 0 && g.reservedCount === 0 ? "text-teal-800" : "text-amber-800"}">${esc(lbl)}</td></tr>`;
                    })
                    .join("")}</tbody></table></div></div>`
            }
          </section>
        `;
      }

      function renderHowItWorks() {
        return `

      function renderMobileStickyBar(raffle) {
        if (state.activeView !== "public" || !raffle || state.selectedNumbers.length === 0 || state.receipt) {
          return "";

        const total = state.selectedNumbers.length * raffle.ticketPrice;
        const curUpper = raffle.currency.trim().toUpperCase();

            ? convertToBolivares(total, raffle.currency, state.bcvRate)

        return `

                      <div><label class="block text-xs font-semibold">Estado</label><select id="f-status" class="mt-1 w-full rounded-xl border border-stone-200 bg-white px-3.5 py-2.5 text-sm"><option value="active" ${f.status === "active" ? "selected" : ""}>Activa</option><option value="paused" ${f.status === "paused" ? "selected" : ""}>Pausada</option><option value="finished" ${f.status === "finished" ? "selected" : ""}>Finalizada</option></select></div>
                      <div class="md:col-span-2"><label class="block text-xs font-semibold">Instrucciones de pago</label><textarea id="f-payment" rows="2" maxlength="400" class="mt-1 w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm">${esc(f.paymentInstructions)}</textarea></div>
                      <div><label class="block text-xs font-semibold">Boleto ganador (opcional)</label><input id="f-winner-num" type="text" maxlength="10" value="${esc(f.winnerNumber)}" class="mt-1 w-full rounded-xl border border-stone-200 px-3.5 py-2 text-sm" /></div>
                      <div><label class="block text-xs font-semibold">Nombre del ganador</label><input id="f-winner-name" type="text" maxlength="80" value="${esc(f.winnerName)}" class="mt-1 w-full rounded-xl border border-stone-200 px-3.5 py-2 text-sm" /></div>
                      <div class="md:col-span-2 flex items-center gap-2"><input id="f-featured" type="checkbox" ${f.isFeatured ? "checked" : ""} class="h-4 w-4" /><label for="f-featured" class="text-sm font-medium">Mostrar como rifa principal</label></div>
                    </div>
                    <div class="flex justify-end gap-3 border-t border-stone-100 pt-4">
                      <button type="submit" ${state.adminSaving ? "disabled" : ""} class="min-h-[44px] rounded-xl bg-[#141413] px-5 py-2.5 text-sm font-semibold text-white cursor-pointer">${state.adminSaving ? "Guardando..." : "Guardar cambios"}</button>
                    </div>
                  </form>`
                : `<div class="space-y-4">
                    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                      <div class="inline-flex items-center gap-1 rounded-xl bg-stone-200/70 p-1 self-start">
                        ${[
                          ["all", "Todos"],
                          ["apartado", "Apartados"],
                          ["pagado", "Pagados"],
                        ]
                          .map(
                            ([id, lbl]) =>
                              `<button type="button" data-admin-tfilter="${id}" class="rounded-lg px-3 py-1.5 text-xs font-semibold cursor-pointer ${state.adminTicketFilter === id ? "bg-white shadow-xs" : "text-stone-600"}">${lbl}</button>`
                          )
                          .join("")}
                      </div>
                      <input id="admin-ticket-search" type="search" value="${esc(state.adminTicketSearch)}" placeholder="Buscar #, nombre, cédula, tel o fecha..." class="w-full sm:w-72 rounded-xl border border-stone-200 bg-white py-2 px-3 text-sm" />
                    </div>
                    <div class="overflow-hidden rounded-2xl border border-stone-200 bg-white">
                      <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                          <thead><tr class="border-b border-stone-200 bg-stone-50 text-xs font-semibold text-stone-600"><th class="px-4 py-3">Boleto</th><th class="px-4 py-3">Participante</th><th class="px-4 py-3">Cédula</th><th class="px-4 py-3">WhatsApp</th><th class="px-4 py-3">Fecha y hora</th><th class="px-4 py-3">Estado</th><th class="px-4 py-3 text-right">Acciones</th></tr></thead>
                          <tbody class="divide-y divide-stone-100">
                            ${
                              filteredTickets.length === 0
                                ? `<tr><td colspan="7" class="px-4 py-8 text-center text-stone-500">No hay boletos registrados.</td></tr>`
                                : filteredTickets
                                    .map((t) => {
                                      const fmt = formatTicketNumber(t.ticketNumber, raffle.totalTickets, raffle.startNumber);
                                      const contact = contactByKey.get(t.ticketKey);
                                      const parts = formatReservationDateParts(t.createdAt ?? contact?.createdAt);
                                      const nextStatus = t.status === "pagado" ? "apartado" : "pagado";
                                      return `<tr>
                                        <td class="px-4 py-3 font-mono-custom font-bold">#${fmt}</td>
                                        <td class="px-4 py-3"><p class="font-semibold">${esc(t.holderName)}</p>${t.holderCity ? `<p class="text-xs text-stone-500">${esc(t.holderCity)}</p>` : ""}</td>
                                        <td class="px-4 py-3 font-mono-custom text-xs">${esc(contact?.holderCedula || "—")}</td>
                                        <td class="px-4 py-3 font-mono-custom text-xs">${esc(contact?.phone || "—")}</td>
                                        <td class="px-4 py-3 whitespace-nowrap">${parts ? `<p class="font-mono-custom text-xs font-medium">${esc(parts.date)}</p><p class="font-mono-custom text-[11px] text-stone-500">${esc(parts.time)}</p>` : "—"}</td>
                                        <td class="px-4 py-3 text-xs font-semibold ${t.status === "pagado" ? "text-teal-800" : "text-amber-800"}">${t.status === "pagado" ? "Pagado" : "Apartado"}</td>
                                        <td class="px-4 py-3 text-right space-x-1 whitespace-nowrap">
                                          <button type="button" data-toggle-status="${esc(t.ticketKey)}:${nextStatus}" class="rounded-lg border px-2.5 py-1.5 text-xs font-semibold cursor-pointer ${t.status === "pagado" ? "border-stone-300 bg-white" : "border-teal-700 bg-teal-700 text-white"}">${t.status === "pagado" ? "Pasar a apartado" : "Confirmar pago"}</button>
                                          <button type="button" data-release-ticket="${esc(t.ticketKey)}:${fmt}" class="rounded-lg border border-red-200 px-2.5 py-1.5 text-xs font-semibold text-red-700 cursor-pointer">Liberar</button>
                                        </td>
                                      </tr>`;
                                    })
                                    .join("")
                            }
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>`
            }
          </main>
        `;
      }

      // === EVENTOS E INTERACCIONES ===
      function bindEvents(raffle) {
        document.querySelectorAll("[data-action='go-admin']").forEach((el) =>
          el.addEventListener("click", () => {
            state.activeView = "admin";
            render();
          })
        );
        document.querySelectorAll("[data-action='go-public']").forEach((el) =>
          el.addEventListener("click", () => {
            state.activeView = "public";
            render();
          })
        );
        document.querySelectorAll("[data-scroll]").forEach((el) =>
          el.addEventListener("click", () => {
            const targetId = el.getAttribute("data-scroll");
            if (state.activeView !== "public") {
              state.activeView = "public";
              render();
            }
            setTimeout(() => document.getElementById(targetId)?.scrollIntoView({ behavior: "smooth" }), 50);
          })
        );
        document.querySelectorAll("[data-select-raffle]").forEach((el) =>
          el.addEventListener("click", () => {
            state.selectedRaffleId = el.getAttribute("data-select-raffle");
            state.selectedNumbers = [];
            state.receipt = null;
            attachRaffleSubcollections();
            render();
          })
        );
        document.querySelectorAll("[data-board-filter]").forEach((el) =>
          el.addEventListener("click", () => {
            state.boardFilter = el.getAttribute("data-board-filter");
            render();
          })
        );
        document.getElementById("board-search")?.addEventListener("input", (e) => {
          state.boardSearch = e.target.value;
          render();
          const inp = document.getElementById("board-search");
          inp?.focus();
          inp?.setSelectionRange(inp.value.length, inp.value.length);
        });
        document.querySelectorAll("[data-random]").forEach((el) =>
          el.addEventListener("click", () => {
            if (!raffle || raffle.status !== "active") return;
            const count = Number(el.getAttribute("data-random"));
            const taken = new Set([...state.tickets.map((t) => t.ticketNumber), ...state.selectedNumbers]);
            const avail = [];
            for (let i = 0; i < raffle.totalTickets; i++) {
              const num = raffle.startNumber + i;
              if (!taken.has(num)) avail.push(num);
            }
            for (let i = avail.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [avail[i], avail[j]] = [avail[j], avail[i]];
            }
            state.selectedNumbers = Array.from(new Set([...state.selectedNumbers, ...avail.slice(0, count)]))
              .slice(0, 25)
              .sort((a, b) => a - b);
            state.receipt = null;
            render();
          })
        );
        document.querySelectorAll("[data-ticket]").forEach((el) =>
          el.addEventListener("click", () => {
            const num = Number(el.getAttribute("data-ticket"));
            const existing = state.tickets.find((t) => t.ticketNumber === num);
            if (existing) {
              state.inspectedTicket = existing;
              render();
              return;
            }
            if (!raffle || raffle.status !== "active") return;
            state.inspectedTicket = null;
            state.receipt = null;
            if (state.selectedNumbers.includes(num)) {
              state.selectedNumbers = state.selectedNumbers.filter((n) => n !== num);
            } else if (state.selectedNumbers.length < 25) {
              state.selectedNumbers = [...state.selectedNumbers, num].sort((a, b) => a - b);
            }
            render();
          })
        );
        document.querySelector("[data-action='close-inspect']")?.addEventListener("click", () => {
          state.inspectedTicket = null;
          render();
        });
        document.querySelectorAll("[data-remove-num]").forEach((el) =>
          el.addEventListener("click", () => {
            const n = Number(el.getAttribute("data-remove-num"));
            state.selectedNumbers = state.selectedNumbers.filter((x) => x !== n);
            render();
          })
        );
        document.querySelector("[data-action='clear-selection']")?.addEventListener("click", () => {
          state.selectedNumbers = [];
          render();
        });
        document.querySelector("[data-action='reset-receipt']")?.addEventListener("click", () => {
          state.receipt = null;
          render();
        });

        document.getElementById("buyer-name")?.addEventListener("input", (e) => (state.buyerName = e.target.value));
        document.getElementById("buyer-cedula")?.addEventListener("input", (e) => (state.buyerCedula = e.target.value));
        document.getElementById("buyer-city")?.addEventListener("input", (e) => (state.buyerCity = e.target.value));
        document.getElementById("buyer-phone")?.addEventListener("input", (e) => (state.buyerPhone = e.target.value));

        document.getElementById("buyer-form")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          const errs = {};
          const name = state.buyerName.trim();
          const cedula = state.buyerCedula.trim();
          const cedulaDigits = normalizeCedulaDigits(cedula);
          const phoneDigits = sanitizePhoneDigits(state.buyerPhone);
          if (state.selectedNumbers.length === 0) errs.selectedNumbers = "Selecciona un boleto.";
          if (name.length < 2) errs.holderName = "Ingresa tu nombre completo.";
          if (cedulaDigits.length < 5 || cedulaDigits.length > 15) errs.holderCedula = "Ingresa una cédula válida.";
          if (phoneDigits.length < 7 || phoneDigits.length > 18) errs.phone = "Ingresa un WhatsApp válido.";
          if (Object.keys(errs).length > 0) {
            state.buyerErrors = errs;
            render();
            return;
          }
          state.buyerErrors = {};
          state.buyerSubmitError = null;
          state.buyerSubmitting = true;
          render();
          try {
            const nums = [...state.selectedNumbers].sort((a, b) => a - b);
            const cedulaHash = await hashCedula(cedula);
            await runTransaction(db, async (tx) => {
              const refs = nums.map((num) => ({
                num,
                key: String(num),
                tRef: doc(db, "raffles", raffle.id, "tickets", String(num)),
                cRef: doc(db, "raffles", raffle.id, "contacts", String(num)),
              }));
              const snaps = await Promise.all(refs.map((r) => tx.get(r.tRef)));
              for (let i = 0; i < snaps.length; i++) {
                if (snaps[i].exists()) {
                  throw new Error(`El boleto #${formatTicketNumber(refs[i].num, raffle.totalTickets, raffle.startNumber)} acaba de ser apartado.`);
                }
              }
              for (const item of refs) {
                tx.set(item.tRef, {
                  raffleId: raffle.id,
                  ticketKey: item.key,
                  ticketNumber: item.num,
                  holderName: name.slice(0, 80),
                  holderCity: state.buyerCity.trim().slice(0, 60),
                  holderCedulaHash: cedulaHash,
                  status: "apartado",
                  createdAt: serverTimestamp(),
                  updatedAt: serverTimestamp(),
                });
                tx.set(item.cRef, {
                  raffleId: raffle.id,
                  ticketKey: item.key,
                  holderName: name.slice(0, 80),
                  holderCedula: cedula.slice(0, 20),
                  phone: state.buyerPhone.trim().slice(0, 25),
                  createdAt: serverTimestamp(),
                });
              }
            });
            const totalAmount = nums.length * raffle.ticketPrice;
            const totalAmountBs = convertToBolivares(totalAmount, raffle.currency, state.bcvRate);
            state.receipt = {
              raffleTitle: raffle.title,
              formattedNumbers: nums.map((n) => formatTicketNumber(n, raffle.totalTickets, raffle.startNumber)),
              holderName: name,
              holderCedula: cedula,
              totalAmount,
              totalAmountBs,
              currency: raffle.currency,
              paymentInstructions: raffle.paymentInstructions,
              whatsappUrl: buildWhatsAppUrl({
                whatsappPhone: raffle.whatsappNumber,
                raffleTitle: raffle.title,
                ticketNumbers: nums,
                totalTickets: raffle.totalTickets,
                startNumber: raffle.startNumber,
                totalAmount,
                totalAmountBs,
                currency: raffle.currency,
                holderName: name,
                holderCedula: cedula,
                holderCity: state.buyerCity.trim(),
              }),
            };
            state.selectedNumbers = [];
            state.buyerName = "";
            state.buyerCedula = "";
            state.buyerCity = "";
            state.buyerPhone = "";
          } catch (err) {
            state.buyerSubmitError = err.message || "Error al apartar.";
          } finally {
            state.buyerSubmitting = false;
            render();
          }
        });

        // Verificador
        document.querySelectorAll("[data-verify-mode]").forEach((el) =>
          el.addEventListener("click", () => {
            state.verifyMode = el.getAttribute("data-verify-mode");
            render();
          })
        );
        document.getElementById("verify-input")?.addEventListener("input", (e) => (state.verifyQuery = e.target.value));
        document.getElementById("verify-form")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!raffle) return;
          const q = state.verifyQuery.trim();
          if (!q) return;
          const digits = normalizeCedulaDigits(q);
          if (!digits) {
            state.verifyResult = { kind: "invalid", message: "Ingresa un número de boleto o cédula válida." };
            render();
            return;
          }
          const resolvedMode =
            state.verifyMode === "ticket" || state.verifyMode === "cedula"
              ? state.verifyMode
              : q.startsWith("#")
                ? "ticket"
                : /^[vejpVEJP]/.test(q) || digits.length >= 5
                  ? "cedula"
                  : "ticket";
          if (resolvedMode === "ticket") {
            const num = Number(digits);
            if (!Number.isInteger(num) || num < raffle.startNumber || num > raffle.startNumber + raffle.totalTickets - 1) {
              state.verifyResult = { kind: "out_of_range", rawNumber: digits };
            } else {
              const formattedNumber = formatTicketNumber(num, raffle.totalTickets, raffle.startNumber);
              const found = state.tickets.find((t) => t.ticketNumber === num);
              state.verifyResult = found
                ? { kind: "ticket_found", ticket: found, formattedNumber }
                : { kind: "ticket_available", formattedNumber };
            }
          } else {
            if (digits.length < 5) {
              state.verifyResult = { kind: "invalid", message: "Para buscar por cédula ingresa al menos 5 dígitos." };
            } else {
              const h = await hashCedula(digits);
              state.verifyResult = {
                kind: "cedula_results",
                cedulaDigits: digits,
                matches: state.tickets.filter((t) => t.holderCedulaHash === h),
              };
            }
          }
          render();
        });

        document.getElementById("participants-search")?.addEventListener("input", (e) => {
          state.participantsSearch = e.target.value;
          render();
          const inp = document.getElementById("participants-search");
          inp?.focus();
          inp?.setSelectionRange(inp.value.length, inp.value.length);
        });

        // Eventos Admin
        document.querySelector("[data-action='admin-login']")?.addEventListener("click", () => signInWithPopup(auth, googleProvider));
        document.querySelector("[data-action='admin-logout']")?.addEventListener("click", () => signOut(auth));
        document.getElementById("admin-raffle-select")?.addEventListener("change", (e) => {
          state.isCreatingNew = false;
          state.selectedRaffleId = e.target.value;
          const match = state.raffles.find((r) => r.id === e.target.value);
          if (match) state.adminForm = { ...match };
          attachRaffleSubcollections();
          render();
        });
        document.querySelector("[data-action='admin-new-raffle']")?.addEventListener("click", () => {
          state.isCreatingNew = true;
          state.adminTab = "config";
          state.adminForm = { ...DEFAULT_STARTER_RAFFLE, title: "Nueva Rifa", prizeName: "", description: "" };
          render();
        });
        document.querySelectorAll("[data-admin-tab]").forEach((el) =>
          el.addEventListener("click", () => {
            state.adminTab = el.getAttribute("data-admin-tab");
            render();
          })
        );
        document.getElementById("admin-brand-name")?.addEventListener("input", (e) => (state.brandDraft = e.target.value));
        document.getElementById("admin-brand-form")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          const clean = state.brandDraft.trim();
          if (clean.length < 2 || clean.length > 40) {
            state.brandError = "El nombre del sitio debe tener entre 2 y 40 caracteres.";
            render();
            return;
          }
          state.brandError = null;
          state.brandSaving = true;
          render();
          try {
            await setDoc(doc(db, "settings", "branding"), { brandName: clean, updatedAt: serverTimestamp() });
            state.adminFeedback = { type: "success", text: "Nombre del sitio actualizado y guardado en la nube." };
          } catch (err) {
            state.brandError = err.message;
          } finally {
            state.brandSaving = false;
            render();
          }
        });

        document.getElementById("f-image-file")?.addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          state.adminImageBusy = true;
          render();
          try {
            state.adminForm.prizeImage = await compressGalleryImage(file);
          } catch (err) {
            state.adminFeedback = { type: "error", text: err.message };
          } finally {
            state.adminImageBusy = false;
            render();
          }
        });
        document.getElementById("f-image-url")?.addEventListener("input", (e) => (state.adminForm.prizeImage = e.target.value));
        document.querySelector("[data-action='clear-image']")?.addEventListener("click", () => {
          state.adminForm.prizeImage = "";
          render();
        });

        document.getElementById("admin-raffle-form")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = state.adminForm;
          f.title = document.getElementById("f-title").value.trim();
          f.prizeName = document.getElementById("f-prize").value.trim();
          f.description = document.getElementById("f-desc").value.trim();
          f.ticketPrice = Number(document.getElementById("f-price").value);
          f.currency = document.getElementById("f-currency").value;
          f.totalTickets = parseInt(document.getElementById("f-total").value || "100", 10);
          f.startNumber = Number(document.getElementById("f-start").value) === 1 ? 1 : 0;
          f.drawDate = document.getElementById("f-date").value.trim();
          f.drawMethod = document.getElementById("f-method").value.trim();
          f.whatsappNumber = document.getElementById("f-wa").value.trim();
          f.status = document.getElementById("f-status").value;
          f.paymentInstructions = document.getElementById("f-payment").value.trim();
          f.winnerNumber = document.getElementById("f-winner-num").value.trim();
          f.winnerName = document.getElementById("f-winner-name").value.trim();
          f.isFeatured = document.getElementById("f-featured").checked;

          if (f.title.length < 3 || f.prizeName.length < 2 || !(f.ticketPrice > 0)) {
            state.adminFeedback = { type: "error", text: "Verifica el título, premio y precio por boleto." };
            render();
            return;
          }
          state.adminSaving = true;
          render();
          try {
            const targetId = state.isCreatingNew || !raffle ? `rifa-${Date.now().toString(36)}` : raffle.id;
            const batch = writeBatch(db);
            if (f.isFeatured) {
              for (const ex of state.raffles) {
                if (ex.id !== targetId && ex.isFeatured) {
                  batch.update(doc(db, "raffles", ex.id), { isFeatured: false, updatedAt: serverTimestamp() });
                }
              }
            }
            const payload = {
              title: f.title.slice(0, 120),
              description: f.description.slice(0, 500),
              prizeName: f.prizeName.slice(0, 120),
              prizeImage: f.prizeImage.trim().slice(0, MAX_PRIZE_IMAGE_LENGTH),
              ticketPrice: f.ticketPrice,
              currency: f.currency,
              totalTickets: Math.min(1000, Math.max(10, f.totalTickets)),
              startNumber: f.startNumber,
              drawDate: f.drawDate.slice(0, 60),
              drawMethod: f.drawMethod.slice(0, 120),
              whatsappNumber: f.whatsappNumber.slice(0, 25),
              paymentInstructions: f.paymentInstructions.slice(0, 400),
              status: f.status,
              isFeatured: f.isFeatured,
              winnerNumber: f.winnerNumber.slice(0, 10),
              winnerName: f.winnerName.slice(0, 80),
              updatedAt: serverTimestamp(),
            };
            if (state.isCreatingNew || !raffle) {
              batch.set(doc(db, "raffles", targetId), { ...payload, createdAt: serverTimestamp() });
            } else {
              batch.update(doc(db, "raffles", targetId), payload);
            }
            await batch.commit();
            state.isCreatingNew = false;
            state.selectedRaffleId = targetId;
            state.adminFeedback = { type: "success", text: "Rifa guardada en la nube." };
          } catch (err) {
            state.adminFeedback = { type: "error", text: err.message };
          } finally {
            state.adminSaving = false;
            render();
          }
        });

        document.querySelectorAll("[data-admin-tfilter]").forEach((el) =>
          el.addEventListener("click", () => {
            state.adminTicketFilter = el.getAttribute("data-admin-tfilter");
            render();
          })
        );
        document.getElementById("admin-ticket-search")?.addEventListener("input", (e) => {
          state.adminTicketSearch = e.target.value;
          render();
          const inp = document.getElementById("admin-ticket-search");
          inp?.focus();
          inp?.setSelectionRange(inp.value.length, inp.value.length);
        });
        document.querySelectorAll("[data-toggle-status]").forEach((el) =>
          el.addEventListener("click", async () => {
            if (!raffle) return;
            const [key, nextStatus] = el.getAttribute("data-toggle-status").split(":");
            const batch = writeBatch(db);
            batch.update(doc(db, "raffles", raffle.id, "tickets", key), {
              status: nextStatus,
              updatedAt: serverTimestamp(),
            });
            await batch.commit();
          })
        );
        document.querySelectorAll("[data-release-ticket]").forEach((el) =>
          el.addEventListener("click", () => {
            const [key, label] = el.getAttribute("data-release-ticket").split(":");
            state.adminConfirm = { type: "release", key, label };
            render();
          })
        );
        document.querySelector("[data-action='admin-ask-reset']")?.addEventListener("click", () => {
          state.adminConfirm = "reset";
          render();
        });
        document.querySelector("[data-action='admin-ask-delete']")?.addEventListener("click", () => {
          state.adminConfirm = "delete";
          render();
        });
        document.querySelector("[data-action='admin-cancel-confirm']")?.addEventListener("click", () => {
          state.adminConfirm = null;
          render();
        });
        document.querySelector("[data-action='admin-exec-confirm']")?.addEventListener("click", async () => {
          if (!raffle || !state.adminConfirm) return;
          if (state.adminConfirm.type === "release") {
            const batch = writeBatch(db);
            batch.delete(doc(db, "raffles", raffle.id, "tickets", state.adminConfirm.key));
            batch.delete(doc(db, "raffles", raffle.id, "contacts", state.adminConfirm.key));
            await batch.commit();
          } else {
            for (const sub of ["tickets", "contacts"]) {
              const snap = await getDocs(collection(db, `raffles/${raffle.id}/${sub}`));
              for (let i = 0; i < snap.docs.length; i += 400) {
                const b = writeBatch(db);
                snap.docs.slice(i, i + 400).forEach((d) => b.delete(d.ref));
                await b.commit();
              }
            }
            const b = writeBatch(db);
            if (state.adminConfirm === "reset") {
              b.update(doc(db, "raffles", raffle.id), {
                winnerNumber: "",
                winnerName: "",
                status: "active",
                updatedAt: serverTimestamp(),
              });
            } else {
              b.delete(doc(db, "raffles", raffle.id));
              state.selectedRaffleId = "";
            }
            await b.commit();
          }
          state.adminConfirm = null;
          state.adminFeedback = { type: "success", text: "Acción completada." };
          render();
        });
      }

      loadBcvRate();
      setInterval(loadBcvRate, 10 * 60 * 1000);
      render();
    </script>
  </body>
</html>
